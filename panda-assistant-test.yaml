# PandaAssistant - BIGTREETECH Panda Touch hardware test config
# Pins checked against github.com/bigtreetech/PandaTouch_IDF and PandaTouch_PlatformIO
# secrets.yaml needs: wifi_ssid, wifi_password, api_key, ota_password, ap_password (8+ chars)

esphome:
  name: panda-assistant
  friendly_name: PandaAssistant

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: UART0   # USB-C goes through a CH340K bridge to UART0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "PandaAssistant Fallback"
    password: !secret ap_password

captive_portal:

i2c:
  - id: touch_bus
    sda: GPIO2
    scl: GPIO1

display:
  - platform: mipi_rgb
    id: panda_display
    model: RPI
    dimensions:
      width: 800
      height: 480
    update_interval: never
    auto_clear_enabled: false
    reset_pin:
      number: GPIO46
      ignore_strapping_warning: true   # fixed by the board wiring
    de_pin: GPIO38
    pclk_pin: GPIO5
    pclk_frequency: 14.8MHz
    pclk_inverted: true
    hsync_pulse_width: 4
    hsync_back_porch: 16
    hsync_front_porch: 16
    vsync_pulse_width: 4
    vsync_back_porch: 32
    vsync_front_porch: 32
    data_pins:
      red: [6, 7, 8, 9, 10]
      green: [11, 12, 13, 14, 15, 16]
      blue: [17, 18, 48, 47, 39]

touchscreen:
  - platform: gt911
    id: panda_touchscreen
    i2c_id: touch_bus
    reset_pin: GPIO41
    interrupt_pin: GPIO40

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO21
    frequency: 30000Hz

light:
  - platform: monochromatic
    output: backlight_pwm
    name: Backlight
    restore_mode: ALWAYS_ON

# Test screen: colour blocks check the data pins, corner buttons check touch alignment
lvgl:
  pages:
    - id: test_page
      bg_color: 0x000000
      widgets:
        - obj: {x: 160, y: 150, width: 150, height: 100, bg_color: 0xFF0000, widgets: [label: {align: CENTER, text: "RED", text_color: 0xFFFFFF}]}
        - obj: {x: 325, y: 150, width: 150, height: 100, bg_color: 0x00FF00, widgets: [label: {align: CENTER, text: "GREEN", text_color: 0x000000}]}
        - obj: {x: 490, y: 150, width: 150, height: 100, bg_color: 0x0000FF, widgets: [label: {align: CENTER, text: "BLUE", text_color: 0xFFFFFF}]}
        - label: {id: touch_result, align: CENTER, y: 80, text: "Tap each corner button", text_color: 0xFFFFFF}
        - button: {align: TOP_LEFT, width: 140, height: 80, widgets: [label: {align: CENTER, text: "Top left"}], on_click: [lvgl.label.update: {id: touch_result, text: "Top left OK"}]}
        - button: {align: TOP_RIGHT, width: 140, height: 80, widgets: [label: {align: CENTER, text: "Top right"}], on_click: [lvgl.label.update: {id: touch_result, text: "Top right OK"}]}
        - button: {align: BOTTOM_LEFT, width: 140, height: 80, widgets: [label: {align: CENTER, text: "Bottom left"}], on_click: [lvgl.label.update: {id: touch_result, text: "Bottom left OK"}]}
        - button: {align: BOTTOM_RIGHT, width: 140, height: 80, widgets: [label: {align: CENTER, text: "Bottom right"}], on_click: [lvgl.label.update: {id: touch_result, text: "Bottom right OK"}]}
